manifestVersion: 1.5.0

app: golem-kgs-effect

environments:
  local:
    server: local
  cloud:
    server: cloud

secretDefaults:
  local:
    db:
      user: "{{ POSTGRES_USER }}"
      password: "{{ POSTGRES_PASSWORD }}"

components:
  golem-kgs-effect:effect-main:
    dir: ""
    templates: effect
    config:
      db:
        host: "{{ POSTGRES_HOST }}"
        db: "{{ POSTGRES_DB }}"
        port: "{{ POSTGRES_PORT }}"

httpApi:
  deployments:
    local:
      - domain: golem-kgs-effect.localhost:9006
        agents:
          Counter: {}
