manifestVersion: 1.5.0

app: golem-kgs-effect

environments:
  local:
    server: local
  cloud:
    server: cloud

secretDefaults:
  local:
    db:
      user: "{{ POSTGRES_USER }}"
      password: "{{ POSTGRES_PASSWORD }}"
    embedding:
      apiKey: "{{ EMBEDDING_API_KEY }}"
    resources:
      s3:
        main:
          endpoint: "{{ S3_ENDPOINT_URL }}"
          region: "{{ AWS_DEFAULT_REGION }}"
          bucket: "golem-documents"
          prefixes:
            - "rfcs/"
            - "specs/"
          accessKeyId: "{{ AWS_ACCESS_KEY_ID }}"
          secretAccessKey: "{{ AWS_SECRET_ACCESS_KEY }}"
        legal:
          endpoint: "{{ S3_ENDPOINT_URL }}"
          region: "{{ AWS_DEFAULT_REGION }}"
          bucket: "legal-docs"
          accessKeyId: "{{ AWS_ACCESS_KEY_ID }}"
          secretAccessKey: "{{ AWS_SECRET_ACCESS_KEY }}"
        technical:
          endpoint: "{{ S3_ENDPOINT_URL }}"
          region: "{{ AWS_DEFAULT_REGION }}"
          bucket: "technical-docs"
          prefixes:
            - "architecture/"
          accessKeyId: "{{ AWS_ACCESS_KEY_ID }}"
          secretAccessKey: "{{ AWS_SECRET_ACCESS_KEY }}"


components:
  golem-kgs-effect:effect-main:
    dir: ""
    templates: effect
    config:
      db:
        host: "{{ POSTGRES_HOST }}"
        db: "{{ POSTGRES_DB }}"
        port: "{{ POSTGRES_PORT }}"
      embedding:
        api_base: "{{ EMBEDDING_API_BASE }}"
        model: "{{ EMBEDDING_MODEL }}"
      extraction:
        dictionary:
          golem: "Golem Cloud"
          golem cloud: "Golem Cloud"
          effect: "Effect-TS"
          typescript: "TypeScript"
          postgresql: "PostgreSQL"
          postgres: "PostgreSQL"
          pgvector: "pgvector"
          docker: "Docker"
          rustfs: "RustFS"
          ollama: "Ollama"
          s3: "Amazon S3"
          aws: "Amazon Web Services"
          wasm: "WebAssembly"
          webassembly: "WebAssembly"
          quickjs: "QuickJS"
          hnsw: "HNSW Index"
          rrf: "Reciprocal Rank Fusion"
          graphrag: "GraphRAG"
        relationPatterns:
          - relation: "DEPENDS_ON"
            confidence: 0.85
            phrases:
              - "depends on"
              - "requires"
              - "relies on"
              - "uses"
              - "utilizes"
              - "leverages"
          - relation: "AUTHORED_BY"
            confidence: 0.90
            phrases:
              - "authored by"
              - "written by"
              - "created by"
          - relation: "PART_OF"
            confidence: 0.85
            phrases:
              - "is part of"
              - "belongs to"
              - "member of"
          - relation: "RELATES_TO"
            confidence: 0.80
            phrases:
              - "contains"
              - "includes"
              - "references"
              - "mentions"
              - "points to"
              - "relates to"
        stopwords:
          - "Table Of"
          - "The Following"
          - "For Example"
          - "In Addition"

httpApi:
  deployments:
    local:
      - domain: golem-kgs-effect.localhost:9006
        agents:
          KnowledgeAccessAgent: {}
          IngestionCoordinatorAgent: {}
          S3IngestorTaskAgent: {}
